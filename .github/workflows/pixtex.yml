name: Update workflow diagram

on:
  push:
    branches: [main]
    paths:
      - 'examples/n8n_ofok_operations_lab.json'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Re-render n8n diagram
        id: pixtex
        uses: VicegerentPrince/pixtex@v1
        with:
          workflow: examples/n8n_ofok_operations_lab.json
          api-key: ${{ secrets.PIXTEX_API_KEY }}
          image-id: ${{ vars.PIXTEX_IMAGE_ID || 'Cg_BYhMKkRY' }}

      - name: Output diagram URL
        run: echo "Updated diagram URL -> ${{ steps.pixtex.outputs.image-url }}"
